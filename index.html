<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mysol | 2D Pixel Game</title>
    <meta name="description" content="LinesF의 2D 픽셀 게임 프로젝트입니다.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;800&family=Fira+Code:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Title Screen Overlay (Login, Sign Up & Guest Mode) -->
    <div id="title-screen-overlay" class="title-screen-overlay">
        <div class="title-card">
            <!-- Game Logo & Subtitle -->
            <div class="title-logo-container">
                <span class="logo-badge">2D PIXEL SURVIVAL</span>
                <h1 class="logo-title">mysol</h1>
            </div>

            <!-- Auth Navigation Tabs -->
            <div class="auth-tabs">
                <button id="tab-btn-login" class="auth-tab-btn active">로그인</button>
                <button id="tab-btn-signup" class="auth-tab-btn">계정 생성</button>
            </div>

            <!-- Form 1: LOGIN TAB -->
            <div id="auth-form-login" class="auth-form-body">
                <!-- Google OAuth Button -->
                <button id="btn-google-login" class="social-login-btn google-btn">
                    <svg class="google-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                    <span>Google 계정으로 로그인</span>
                </button>

                <div class="form-divider"><span>또는 이메일로 로그인</span></div>

                <div class="input-group">
                    <label for="login-email">이메일 주소</label>
                    <input type="email" id="login-email" placeholder="example@mysol.com" autocomplete="off">
                </div>
                <div class="input-group">
                    <label for="login-password">비밀번호</label>
                    <input type="password" id="login-password" placeholder="••••••••">
                </div>

                <button id="btn-login-submit" class="auth-submit-btn">로그인</button>
            </div>

            <!-- Form 2: SIGN UP TAB (Email -> Code Verification -> Password & Confirm) -->
            <div id="auth-form-signup" class="auth-form-body hidden">
                <div class="input-group">
                    <label for="signup-email">이메일 주소</label>
                    <div class="input-with-button">
                        <input type="email" id="signup-email" placeholder="example@mysol.com" autocomplete="off">
                        <button id="btn-send-code" class="action-sub-btn">인증 코드 발송</button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="signup-code">인증 코드 (6자리)</label>
                    <div class="input-with-button">
                        <input type="text" id="signup-code" placeholder="예: 742918" maxlength="6" autocomplete="off">
                        <button id="btn-verify-code" class="action-sub-btn">확인</button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="signup-password">비밀번호</label>
                    <input type="password" id="signup-password" placeholder="비밀번호 입력 (6자리 이상)">
                </div>

                <div class="input-group">
                    <label for="signup-password-confirm">비밀번호 재확인</label>
                    <input type="password" id="signup-password-confirm" placeholder="비밀번호 다시 입력">
                </div>

                <button id="btn-signup-submit" class="auth-submit-btn">계정 생성 완료</button>
            </div>

            <div class="form-divider bottom-divider"></div>

            <!-- Guest Mode Button -->
            <button id="btn-guest-start" class="guest-start-btn">
                <span>👤 방문자로 시작하기</span>
            </button>
        </div>
    </div>

    <!-- Top-Left Character Profile & Status Bars -->
    <header class="top-header">
        <div class="player-hud">
            <div class="player-avatar-container">
                <img id="player-avatar-img" src="https://github.com/LinesF.png" alt="Player Portrait" class="player-avatar-img" onerror="this.src='https://api.dicebear.com/7.x/identicon/svg?seed=LinesF'">
            </div>
            <div class="status-bars-container">
                <div class="player-username-row">
                    <span id="player-username-display" class="player-username-display">LinesF</span>
                </div>
                <!-- 1. Red Bar: Health (100) -->
                <div class="status-bar-row health-row">
                    <span class="bar-label">HP</span>
                    <div class="bar-track">
                        <div class="bar-fill red-fill" style="width: 100%;"></div>
                        <span class="bar-value">100</span>
                    </div>
                </div>
                <!-- 2. Orange Bar: Stamina (100) - Connected to Shift Sprint -->
                <div class="status-bar-row energy-row" title="스태미나 (Shift키 달리기 소모)">
                    <span class="bar-label">STA</span>
                    <div class="bar-track">
                        <div id="stamina-bar-fill" class="bar-fill yellow-fill" style="width: 100%;"></div>
                        <span id="stamina-bar-val" class="bar-value">100</span>
                    </div>
                </div>
                <!-- 3. Grey Bar: Flashlight Battery Utility (100/100) -->
                <div class="status-bar-row equip-row" title="후레쉬 배터리 (수동 발전기를 들고 R키로 충전)">
                    <span class="bar-label">BAT</span>
                    <div class="bar-track">
                        <div id="battery-bar-fill" class="bar-fill grey-fill" style="width: 100%;"></div>
                        <span id="battery-bar-val" class="bar-value">100</span>
                    </div>
                </div>
            </div>
            <!-- Camera Lock Indicator Badge -->
            <div id="cam-lock-badge" class="cam-lock-badge locked" title="화면 고정 토글 (Y)">
                <span class="cam-lock-icon">🔒</span>
                <span class="cam-lock-text">CAM LOCK (Y)</span>
            </div>
        </div>
    </header>

    <!-- Main Game Canvas Container -->
    <main class="game-container">
        <canvas id="game-canvas" width="800" height="600"></canvas>
    </main>

    <!-- Flashlight Controls Guidance Banner & Camera Limit Warning Toast Banner -->
    <div id="flashlight-toast" class="flashlight-toast hidden">
        <span>🔦 후레쉬 ON (F / CapsLock | 수동 발전기로 충전)</span>
    </div>

    <div id="camera-warning-toast" class="camera-warning-toast hidden">
        <span>⚠️ 카메라 이동 최대 거리에 도달했습니다 (최대 10칸)</span>
    </div>

    <!-- Bottom Left Stack: Inventory Window (Above Chat Bar) & Chat Bar -->
    <div class="bottom-left-stack">
        <!-- Inventory Window (Equipment Grid + Inventory Grid) -->
        <div id="inventory-window" class="inventory-window hidden">
            <!-- 1. Equipment Section (6 slots: Head, Body, Legs, Feet, Offhand, Special) -->
            <div class="inventory-header">
                <span class="inventory-title">🛡️ EQUIPMENT</span>
                <span class="inventory-shortcut">CapsLock</span>
            </div>
            <div id="equipment-grid" class="equipment-grid">
                <!-- 6 Equipment slots (3x2) -->
            </div>

            <!-- Divider -->
            <div class="inventory-divider"></div>

            <!-- 2. Inventory Section (6 slots: 3x2) -->
            <div class="inventory-header">
                <span class="inventory-title">🎒 INVENTORY</span>
                <span class="inventory-shortcut">Tab</span>
            </div>
            <div id="inventory-grid" class="inventory-grid">
                <!-- 6 Inventory slots (3x2) -->
            </div>
        </div>

        <!-- Chat Input Bar -->
        <div class="chat-bar-container">
            <div class="chat-input-wrapper">
                <span class="chat-prompt-icon">💬</span>
                <input type="text" id="chat-input" placeholder="엔터(Enter) 키를 눌러 대화..." maxlength="20" autocomplete="off">
                <span id="chat-char-count" class="chat-char-count">0/20</span>
            </div>
        </div>
    </div>

    <!-- Bottom Right Stack: Phone UI (Above Hotbar) & Hotbar -->
    <div class="bottom-right-stack">
        <!-- Smartphone UI (20:9 Ratio Vertical Screen) -->
        <div id="phone-screen-container" class="phone-screen-container hidden">
            <div class="phone-frame">
                <div class="phone-notch"></div>
                <div class="phone-screen-body">
                    <div class="phone-status-bar">
                        <span class="phone-time">22:08</span>
                        <div class="phone-status-icons">
                            <span>📶</span>
                            <span>🔋</span>
                        </div>
                    </div>
                    <!-- Clean White Screen Area -->
                    <div class="phone-content">
                        <div class="phone-placeholder">
                            <span class="phone-icon-big">📱</span>
                            <span class="phone-title">MY PHONE</span>
                        </div>
                    </div>
                    <div class="phone-home-bar"></div>
                </div>
            </div>
        </div>

        <!-- Hotbar Wrapper -->
        <div class="hotbar-wrapper">
            <div id="hotbar-grid" class="hotbar-grid">
                <!-- 3 Hotbar slots (1, 2, 3) -->
            </div>
            <button id="btn-toggle-inventory" class="btn-inv-toggle" title="인벤토리 열기/닫기 (Tab)">
                <span class="inv-icon">🎒</span>
                <span class="inv-badge">Tab</span>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
