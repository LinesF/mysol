<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mysol | 2D Pixel Game</title>
    <meta name="description" content="LinesF의 2D 픽셀 게임 프로젝트입니다.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;800&family=Fira+Code:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top-Left Character Profile & Status Bars -->
    <header class="top-header">
        <div class="player-hud">
            <div class="player-avatar-container">
                <img src="https://github.com/LinesF.png" alt="Player Portrait" class="player-avatar-img" onerror="this.src='https://api.dicebear.com/7.x/identicon/svg?seed=LinesF'">
            </div>
            <div class="status-bars-container">
                <!-- 1. Red Bar: Health (100) -->
                <div class="status-bar-row health-row">
                    <span class="bar-label">HP</span>
                    <div class="bar-track">
                        <div class="bar-fill red-fill" style="width: 100%;"></div>
                        <span class="bar-value">100</span>
                    </div>
                </div>
                <!-- 2. Yellow Bar: Energy/Stamina (50) -->
                <div class="status-bar-row energy-row">
                    <span class="bar-label">ENG</span>
                    <div class="bar-track">
                        <div class="bar-fill yellow-fill" style="width: 50%;"></div>
                        <span class="bar-value">50</span>
                    </div>
                </div>
                <!-- 3. Grey Bar: Equipment Utility (0) -->
                <div class="status-bar-row equip-row">
                    <span class="bar-label">EQUIP</span>
                    <div class="bar-track">
                        <div class="bar-fill grey-fill" style="width: 0%;"></div>
                        <span class="bar-value">0</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Canvas -->
    <main class="game-container">
        <canvas id="game-canvas"></canvas>
    </main>

    <!-- Bottom Left Inventory Window (3 cols x 2 rows) -->
    <div id="inventory-window" class="inventory-window hidden">
        <div class="inventory-header">
            <span class="inventory-title">🎒 INVENTORY</span>
            <span class="inventory-shortcut">Tab</span>
        </div>
        <div id="inventory-grid" class="inventory-grid">
            <!-- 6 Inventory slots (3x2) -->
        </div>
    </div>

    <!-- Bottom Right Hotbar & Inventory Toggle Button -->
    <div class="hotbar-wrapper">
        <div id="hotbar-grid" class="hotbar-grid">
            <!-- 3 Hotbar slots (1, 2, 3) -->
        </div>
        <button id="btn-toggle-inventory" class="btn-inv-toggle" title="인벤토리 열기/닫기 (Tab)">
            <span class="inv-icon">🎒</span>
            <span class="inv-badge">Tab</span>
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
